[package]
name = "offer"
version = "0.1.0"
description = "LocalMoney Offer Program - Marketplace listing management"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "offer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

# Cross-program dependencies for CPI
hub = { path = "../hub", features = ["cpi"] }
profile = { path = "../profile", features = ["cpi"] }
