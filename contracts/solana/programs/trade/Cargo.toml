[package]
name = "trade"
version = "0.1.0"
description = "LocalMoney Trade Program - Core P2P exchange logic"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trade"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

# Cross-program dependencies for CPI
hub = { path = "../hub", features = ["cpi"] }
offer = { path = "../offer", features = ["cpi"] }
profile = { path = "../profile", features = ["cpi"] }
escrow = { path = "../escrow", features = ["cpi"] }
arbitrator = { path = "../arbitrator", features = ["cpi"] }
